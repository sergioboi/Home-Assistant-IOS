name: CAS Cache

on:
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Cache mode to test
        type: choice
        required: true
        default: local
        options:
          - local
          - remote
      clear_local_cache_dir:
        description: Clear .ci/cas-build-cache before cold local-cache builds
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_XCODE_LIST_TIMEOUT: 80
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 80
  HOMEBREW_NO_INSTALL_CLEANUP: TRUE
  BUNDLE_PATH: vendor/bundle
  CAS_DERIVED_DATA_PATH: ${{ runner.temp }}/homeassistant-cas-derived-data

jobs:
  cas-cache:
    name: CAS cache warm and verify
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CACHE_MODE: ${{ inputs.cache_mode }}
      CLEAR_LOCAL_CACHE_DIR: ${{ inputs.clear_local_cache_dir }}

    steps:
      - name: Print Mac machine info
        run: |
          echo "Runner:"
          echo "  name=${RUNNER_NAME}"
          echo "  os=${RUNNER_OS}"
          echo "  arch=${RUNNER_ARCH}"

          echo
          echo "macOS:"
          sw_vers

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "Hardware:"
          echo "  model=$(sysctl -n hw.model)"
          echo "  cpu=$(sysctl -n machdep.cpu.brand_string)"
          echo "  arch=$(uname -m)"
          echo "  physical_cores=$(sysctl -n hw.physicalcpu)"
          echo "  logical_cores=$(sysctl -n hw.logicalcpu)"
          mem_bytes="$(sysctl -n hw.memsize)"
          ram_gb="$(awk -v bytes="${mem_bytes}" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 / 1024 }')"
          echo "  ram_gb=${ram_gb}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1.321.0
        with:
          ruby-version: .ruby-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        name: "Cache: Gems"
        id: cache_gems
        with:
          path: vendor/bundle
          key: >-
            ${{ format('{0}-gems-{1}-{2}-{3}',
            runner.os,
            env.ImageVersion,
            env.DEVELOPER_DIR,
            hashFiles('.ruby-version', '**/Gemfile.lock')) }}

      - name: Install Gems
        if: steps.cache_gems.outputs.cache-hit != 'true'
        run: bundle install --jobs 4 --retry 3

      - name: Install CASBuildCache
        if: ${{ inputs.cache_mode == 'local' }}
        run: exec ./.github/scripts/install-cas-build-cache.sh

      - name: Install xcodecacheprog
        if: ${{ inputs.cache_mode == 'remote' }}
        run: exec ./.github/scripts/install-xcodecacheprog.sh

      - name: Select cache build script
        run: |
          if [[ "${CACHE_MODE}" == "remote" ]]; then
            echo "CACHE_BUILD_SCRIPT=./.github/scripts/run-remote-cached-build.sh" >> "${GITHUB_ENV}"
          else
            echo "CACHE_BUILD_SCRIPT=./.github/scripts/run-cas-cached-build.sh" >> "${GITHUB_ENV}"
          fi

      - name: Ensure first build starts without local CAS data
        run: |
          if [[ "${CACHE_MODE}" == "local" && "${CLEAR_LOCAL_CACHE_DIR}" == "true" ]]; then
            rm -rf .ci/cas-build-cache
          else
            echo "Skipping local CAS cache directory cleanup"
          fi

      - name: Clean resources before empty-cache build
        run: exec ./.github/scripts/clean-cas-build-resources.sh

      - name: Build with empty CAS cache
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/XcodeCache.xcconfig
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec "${CACHE_BUILD_SCRIPT}"

      - name: Clean resources after empty-cache build
        if: ${{ always() }}
        run: exec ./.github/scripts/clean-cas-build-resources.sh

      - name: Ensure second build starts without local CAS data
        run: |
          if [[ "${CACHE_MODE}" == "local" && "${CLEAR_LOCAL_CACHE_DIR}" == "true" ]]; then
            rm -rf .ci/cas-build-cache
          else
            echo "Skipping local CAS cache directory cleanup"
          fi

      - name: Build after clean to warm CAS cache
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/XcodeCache.xcconfig
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec "${CACHE_BUILD_SCRIPT}"

      - name: Clean resources after cache-warming build
        if: ${{ always() }}
        run: exec ./.github/scripts/clean-cas-build-resources.sh

      - name: Show warmed cache
        if: ${{ inputs.cache_mode == 'local' }}
        run: |
          du -sh .ci/cas-build-cache
          find .ci/cas-build-cache -maxdepth 2 -type f | head -n 30

      - name: Build after clean with warmed CAS cache
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/XcodeCache.xcconfig
          XCODECACHEPROG_TOKEN: ${{ secrets.XCODECACHEPROG_TOKEN }}
        run: exec "${CACHE_BUILD_SCRIPT}"

      - name: Clean resources after warmed-cache build
        if: ${{ always() }}
        run: exec ./.github/scripts/clean-cas-build-resources.sh

      - name: Clean local CAS cache directory
        if: ${{ always() && inputs.cache_mode == 'local' }}
        run: rm -rf .ci/cas-build-cache
